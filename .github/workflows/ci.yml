name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4

      - name: clang-format
        run: mise run fmt:check

      - name: zig build (release)
        run: ZIG_OPTIMIZE=ReleaseSmall mise run wasm

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasmdoom-wasm
          path: zig-out/bin/*.wasm
          if-no-files-found: error
          retention-days: 3

  simulate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}

      - name: Static checks
        run: mise run tools:check

      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: wasmdoom-wasm
          path: zig-out/bin

      # Mark the downloaded artifact newer than the C sources so the `wasm`
      # task dependency is treated as up-to-date and not rebuilt.
      - name: Mark wasm artifact fresh
        run: touch zig-out/bin/*.wasm

      - name: Render WAD music
        run: mise run tools:render-music-all

      - name: Upload `D_E1M1.wav` Music Sample
        uses: actions/upload-artifact@v7
        with:
          name: music-sample
          path: ci-out/music/D_E1M1.wav
          if-no-files-found: error
          retention-days: 5

      - name: Run scripted simulations
        run: mise run tools:simulate

      - name: Upload simulation snapshots
        uses: actions/upload-artifact@v7
        with:
          name: sim-snapshots
          path: ci-out/simulations
          if-no-files-found: error
          retention-days: 5

  web:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Static checks
        working-directory: ${{ github.workspace }}
        run: mise run web:check

      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: wasmdoom-wasm
          path: zig-out/bin

      - name: Build web bundle
        run: npm run build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 5

      - name: Build pages bundle
        run: npm run build
        env:
          BASE_PATH: /wasmdoom/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [web]

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
